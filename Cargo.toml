[package]
name = "leptos-styles"
version = "0.2.0"
edition = "2024"
rust-version = "1.89.0"
authors = ["Lukas Potthast <privat@lukas-potthast.de>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/lpotthast/leptos-styles"
homepage = "https://github.com/lpotthast/leptos-styles"
documentation = "https://docs.rs/leptos-styles"
description = "Prop-drillable, reactive CSS style container for Leptos"
categories = ["web-programming", "gui", "wasm"]
keywords = ["leptos", "css", "style", "reactive", "props"]
exclude = [
    "/.codegraph/**",
    "/.cargo/**",
    "/.github/**",
    "/.idea/**",
    "/AGENTS.md",
    "/Justfile",
    "/testing/**",
    "/tests/**",
]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
leptos = { version = "0.8.22", default-features = false }
smallvec = "1"
typed-css = { version = "0.2.0", features = ["leptos"] }

[dev-dependencies]
assertr = { version = "0.9.1", default-features = false, features = ["std"] }
leptos = { version = "0.8.22", features = ["csr", "hydrate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
browser-test = "0.7.0"
leptos-browser-test = "0.4.0"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "registry"] }

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(web_sys_unstable_apis)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
